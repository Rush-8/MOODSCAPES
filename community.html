<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - MoodScape</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d3f4c6;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 50px;
            margin-right: 10px;
        }
        .logo h2 {
            color: #2d9959; /* Green color for "MOODSCAPE" */
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-left img {
            width: 40px; /* Adjust size of logo */
            height: 40px;
        }
        .navbar-left h1 {
            font-size: 24px;
            color: #2d9959;
        }
        .navbar-right {
            display: flex;
            gap: 15px;
        }
        .navbar button {
            background-color: #54b86e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .navbar button.active {
            background-color: #2d9959;
        }

        .content {
            margin: 30px auto;
            width: 80%;
        }
        .card {
            background-color: #c8e6c9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .journal {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .journal-card {
            background-color: #a5d6a7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 200px;
        }
        .journal-card img {
            width: 100%;
            border-radius: 10px;
        }
        .weekly-challenge {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Add green color to COMMUNITY and JOURNAL headings */
        .content h1, .content h2 {
            color: #2d9959; /* Green color */
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <img src="img/2.PNG" alt="MoodScape Logo"> <!-- Add your logo image here -->
            <h1>MOODSCAPE</h1>
        </div>
        <div class="navbar-right">
            <a href="log-mood.html"><button>LOG MOOD</button></a>
            <a href="analytics.html"><button>ANALYTICS</button></a>
            <a href="community.html"><button class="active">COMMUNITY</button></a>
            <a href="recommendations.html"><button>RECOMMENDATIONS</button></a>
            <a href="settings.html"><button>SETTINGS</button></a>
        </div>
    </div>
    <div class="content">
        <h1>COMMUNITY</h1>
        <div class="card">
            <h3>Gratitude - <i>Anonymous</i></h3>
            <p>Be kind and pay back for what you receive.</p>
            <button onclick="likePost()">👍 Like</button>
            <button onclick="reportPost()">🚨 Report</button>
        </div>
        <h2>JOURNAL</h2>
        <div class="journal">
            <div class="journal-card">
                <img src="img/15.jpg" alt="Fuel of Motivation">
                <p>FUEL OF MOTIVATION</p>
                <p>💬 452</p>
            </div>
            <div class="journal-card">
                <img src="img/16.jpeg" alt="Ripple Effect of Gratitude">
                <p>RIPPLE EFFECT OF GRATITUDE</p>
                <p>💬 1k</p>
            </div>
            <div class="journal-card">
                <img src="img/17.jpg" alt="Be the Motivator">
                <p>BE THE MOTIVATOR</p>
                <p>💬 560</p>
            </div>
        </div>
        <div class="weekly-challenge">
            <h2>Weekly Challenge</h2>
            <p>Complete the puzzle by logging your moods!</p>
        </div>
    </div>
    <script>
        function likePost() {
            alert('You liked the post!');
        }
        function reportPost() {
            alert('Post reported!');
        }
    </script>
</body>
</html>
