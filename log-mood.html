<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodScape - Log Mood</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d3f4c6;
            color: #2d9959;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 50px;
            margin-right: 10px;
        }
        .navbar {
            display: flex;
            gap: 15px;
        }
        .navbar button {
            background-color: #54b86e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
		
		.navbar button.active {
            background-color: #2d9959;
		}
		
        .main-container {
            display: flex;
            justify-content: space-between;
            padding: 50px;
        }
        .mood-wheel {
            flex: 1;
            text-align: center;
        }
        .mood-wheel img {
            width: 250px;
        }
        .mood-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .mood-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .mood-item:hover, .selected-mood {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 5px;
        }
        .mood-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
        }
        .summary {
            flex: 1;
            text-align: left;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .summary-item img {
            height: 40px;
        }
        .sliders {
            flex: 2;
        }
        .sliders label {
            font-size: 18px;
            font-weight: bold;
        }
        .sliders input {
            width: 100%;
            margin: 10px 0;
        }
        #selectedMood {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="img/2.PNG" alt="MoodScape Logo">
            <h2>MOODSCAPE</h2>
        </div>
        <div class="navbar">
            <a href="log-mood.html"><button class="active">LOG MOOD</button></a>
            <a href="analytics.html"><button>ANALYTICS</button></a>
    		<a href="community.html"><button>COMMUNITY</button></a>
    		<a href="recommendations.html"><button>RECOMMENDATIONS</button></a>
    		<a href="settings.html"><button>SETTINGS</button></a>
        </div>
    </div>

    <div class="main-container">
        <!-- Mood Wheel -->
        <div class="mood-wheel">
            <h2>LOG MOOD</h2>
            <img src="img/6.PNG" alt="Mood Wheel">
            <div class="mood-legend">
                <div class="mood-item" onclick="selectMood(this, 'Happy')" style="color: #FFFF99;">
                    <span class="mood-color" style="background-color: #FFFF99;"></span> Happy
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Grateful')" style="color: #FFD700;">
                    <span class="mood-color" style="background-color: #FFD700;"></span> Grateful
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Overwhelmed')" style="color: #FF9966;">
                    <span class="mood-color" style="background-color: #FF9966;"></span> Overwhelmed
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Frustrated')" style="color: #FF6600;">
                    <span class="mood-color" style="background-color: #FF6600;"></span> Frustrated
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Angry')" style="color: #FF3333;">
                    <span class="mood-color" style="background-color: #FF3333;"></span> Angry
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Excited')" style="color: #FF0090;">
                    <span class="mood-color" style="background-color: #FF0090;"></span> Excited
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Lonely')" style="color: #660066;">
                    <span class="mood-color" style="background-color: #660066;"></span> Lonely
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Anxious')" style="color: #00008B;">
                    <span class="mood-color" style="background-color: #000080;"></span> Anxious
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Sad')" style="color: #4169E1;">
                    <span class="mood-color" style="background-color: #4169E1;"></span> Sad
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Relaxed')" style="color: #66CCCC;">
                    <span class="mood-color" style="background-color: #66CCCC;"></span> Relaxed
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Motivated')" style="color: #006400;">
                    <span class="mood-color" style="background-color: #006400;"></span> Motivated
                </div>
                <div class="mood-item" onclick="selectMood(this, 'Calm')" style="color: #66CC66;">
                    <span class="mood-color" style="background-color: #66CC66;"></span> Calm
                </div>
            </div>
            <p id="selectedMood">Click a color to select your mood</p>
        </div>
    </div>

    <script>
        function selectMood(element, mood) {
            // Remove 'selected-mood' from all items
            document.querySelectorAll('.mood-item').forEach(item => {
                item.classList.remove('selected-mood');
            });

            // Highlight selected mood
            element.classList.add('selected-mood');

            // Update the displayed mood
            document.getElementById('selectedMood').innerText = "You selected: " + mood;
        }
    </script>
	
	        <div class="main-container">
        <div class="sliders">
            <label for="happiness">Happiness Level</label>
            <input type="range" id="happiness" min="0" max="100" value="90" oninput="updateMood()">
            <label for="stress">Stress Level</label>
            <input type="range" id="stress" min="0" max="100" value="30" oninput="updateMood()">
            <label for="energy">Energy Level</label>
            <input type="range" id="energy" min="0" max="100" value="75" oninput="updateMood()">
        </div>
        <div class="summary">
            <div class="summary-item">
                <img src="img/3.PNG" alt="Happy">
                <span>Happiness Level <strong id="happinessValue">90%</strong></span>
            </div>
            <div class="summary-item">
                <img src="img/4.PNG" alt="Stressed">
                <span>Stress Level <strong id="stressValue">30%</strong></span>
            </div>
            <div class="summary-item">
                <img src="img/5.PNG" alt="Energy">
                <span>Energy Level <strong id="energyValue">75%</strong></span>
            </div>
        </div>
    </div>
	

    <script>
        function updateMood() {
            document.getElementById('happinessValue').textContent = document.getElementById('happiness').value + '%';
            document.getElementById('stressValue').textContent = document.getElementById('stress').value + '%';
            document.getElementById('energyValue').textContent = document.getElementById('energy').value + '%';
        }
    </script>

</body>
</html>
